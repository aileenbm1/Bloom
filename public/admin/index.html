<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>BLOOM · Control de pagos</title>
  <meta name="theme-color" content="#6a2f8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BLOOM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <header class="topbar no-print" id="topbar" hidden>
    <a class="logo" href="#/"><img src="/logo-wordmark.png" alt="BLOOM" width="80" height="44"></a>
    <nav>
      <a href="#/">Resumen</a>
      <a href="#/clientes">Clientes</a>
      <a href="#/auditoria">Auditoría</a>
      <a href="#/cuenta">Mi cuenta</a>
    </nav>
    <button type="button" class="ghost" id="logout">Salir</button>
  </header>
  <main id="app" class="wrap" aria-live="polite">
    <p class="muted">Cargando…</p>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="install" class="install no-print" role="region" aria-label="Instalar app" hidden>
    <span id="install-text"></span>
    <button type="button" id="install-btn" hidden>Instalar app</button>
    <button type="button" class="ghost" id="install-close" aria-label="Cerrar">×</button>
  </div>
  <script src="/admin/app.js"></script>
  <script src="/admin/pwa.js"></script>
</body>
</html>
